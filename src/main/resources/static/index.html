
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <aside class="col-md-2 sidebar">
            <h4>EmployeeMS</h4>

            <a href="#" class="active">Dashboard</a>
            <a href="#employeeDirectory">Employees</a>
        </aside>

        <!-- Main Content -->
        <main class="col-md-10 main-content">

            <!-- Topbar -->
            <div class="topbar">
                <div>
                    <h2>Dashboard</h2>
                    <p class="text-muted mb-0">Manage your employees in one place.</p>
                </div>

                <button class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#employeeModal"
                        onclick="resetEmployeeForm()">
                    + Add Employee
                </button>
            </div>

            <!-- Alerts -->
            <div id="alertContainer"></div>

            <!-- Statistics -->
            <div class="row g-3">

                <div class="col-md-6">
                    <div class="stat-card">
                        <p>Total Employees</p>
                        <h3 id="totalEmployees">0</h3>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="stat-card">
                        <p>Total Departments</p>
                        <h3 id="totalDepartments">0</h3>
                    </div>
                </div>

            </div>

            <!-- Employee Directory -->
            <section class="employee-section" id="employeeDirectory">

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                    <div>
                        <h4>Employee Directory</h4>
                        <p class="text-muted mb-0">View and manage your employees.</p>
                    </div>

                    <input
                            type="text"
                            id="searchInput"
                            class="form-control search-input"
                            placeholder="Search employees..."
                    >
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                        </thead>

                        <tbody id="employeeTableBody">
                        <tr>
                            <td colspan="6" class="text-center">
                                Loading employees...
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </section>

        </main>
    </div>
</div>

<!-- Add/Edit Employee Modal -->
<div class="modal fade" id="employeeModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="employeeModalTitle">Add Employee</h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>

            <div class="modal-body">

                <form id="employeeForm">

                    <div class="mb-3">
                        <label class="form-label" for="firstName">First Name</label>
                        <input type="text" id="firstName" class="form-control"
                               maxlength="50" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="lastName">Last Name</label>
                        <input type="text" id="lastName" class="form-control"
                               maxlength="50" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-control"
                               maxlength="100" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="department">Department</label>
                        <input type="text" id="department" class="form-control"
                               maxlength="50">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="salary">Salary</label>
                        <input type="number" id="salary" class="form-control"
                               min="0" step="0.01">
                    </div>

                    <div class="modal-footer px-0 pb-0">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="submit" class="btn btn-primary">
                            Save Employee
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Application JavaScript -->
<script src="app.js"></script>

</body>
</html>
